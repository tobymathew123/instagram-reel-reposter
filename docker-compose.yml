# Instagram Reel Auto-Reposter - everything that runs on your computer.
#
#   n8n          the automation engine (editor at http://localhost:5678)
#   ffmpeg-api   puts your Canva frame on each Reel
#   caddy        a small "doorman": only lets Instagram reach the webhook + finished videos
#   ngrok / cloudflared   gives your computer a public https address (pick ONE in .env)
#
# Start:  run scripts/setup (see README).  Stop:  docker compose down
# All settings come from the .env file next to this file.

name: ig-reel-reposter

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678" # editor is only reachable from this computer
    environment:
      # --- n8n itself ---
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678/
      - WEBHOOK_URL=https://${PUBLIC_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false # the workflow reads its settings from these env vars
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336 # keep 14 days of run history
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - TZ=${TIMEZONE:-UTC}
      # --- values used by the workflow (see .env) ---
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID}
      - ALLOWED_SENDER_IG_ID=${ALLOWED_SENDER_IG_ID}
      - GRAPH_API_VERSION=${GRAPH_API_VERSION:-v22.0}
      - CANVA_FRAME_PNG_URL=${CANVA_FRAME_PNG_URL}
      - FFMPEG_API_URL=http://ffmpeg-api:8080
      - FFMPEG_API_KEY=${FFMPEG_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CHANNEL_NICHE=${CHANNEL_NICHE}
      - CAPTION_FOOTER=${CAPTION_FOOTER}
      - FALLBACK_HASHTAGS=${FALLBACK_HASHTAGS}
      - SEND_DM_CONFIRMATIONS=${SEND_DM_CONFIRMATIONS:-true}
      - DRY_RUN=${DRY_RUN:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  ffmpeg-api:
    build: ./ffmpeg-api
    restart: unless-stopped
    environment:
      - FFMPEG_API_KEY=${FFMPEG_API_KEY}
      - PUBLIC_BASE_URL=https://${PUBLIC_DOMAIN}
      - FILE_TTL_HOURS=48
      # used only by the helper tools in ffmpeg-api/tools
      - CANVA_FRAME_PNG_URL=${CANVA_FRAME_PNG_URL}
      - ALLOWED_SENDER_IG_ID=${ALLOWED_SENDER_IG_ID}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID}
      - GRAPH_API_VERSION=${GRAPH_API_VERSION:-v22.0}
      - DRY_RUN=${DRY_RUN:-false}
    volumes:
      - ffmpeg_data:/data
      - ./branding:/branding:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80" # lets you preview finished videos at http://localhost:8080/files/...
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - n8n
      - ffmpeg-api

  # ---- Public address option A: ngrok (free static domain, easiest) ----
  ngrok:
    image: ngrok/ngrok:latest
    profiles: ["ngrok"]
    restart: unless-stopped
    command: ["http", "caddy:80", "--url=${PUBLIC_DOMAIN}", "--log=stdout"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "127.0.0.1:4040:4040" # ngrok traffic inspector
    depends_on:
      - caddy

  # ---- Public address option B: Cloudflare Tunnel (needs your own domain) ----
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      - caddy

volumes:
  n8n_data:
  ffmpeg_data:
